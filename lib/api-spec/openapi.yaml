openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ambassador
    description: Source-grounded portfolio guide
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ambassador/ask:
    post:
      operationId: askAmbassador
      tags: [ambassador]
      summary: Ask the portfolio ambassador
      description: Returns a verified answer and links to its on-page sources, or an explicit unsupported-claim fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmbassadorQuestion"
      responses:
        "200":
          description: Answer grounded in approved profile facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorAnswer"
        "400":
          description: Invalid question
        "429":
          description: Rate limit exceeded
        "503":
          description: The ambassador is temporarily unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AmbassadorQuestion:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 300
      required: [question]
    AmbassadorCitation:
      type: object
      properties:
        label:
          type: string
        href:
          type: string
      required: [label, href]
    AmbassadorAnswer:
      type: object
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AmbassadorCitation"
        supported:
          type: boolean
        mode:
          type: string
          enum: [model_selected, direct_match]
      required: [answer, citations, supported, mode]

